name: Validate, build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      GH_TOKEN: ${{ github.token }}
      PDF_GITHUB_API: gh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node --test scripts/validate.test.mjs
      - run: make pdf-reading
      - name: Build for repository Pages path
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY" = "$OWNER.github.io" ]; then
            export SITE_BASE=/
          else
            export SITE_BASE="/$REPOSITORY/"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
